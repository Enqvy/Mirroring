name: Download Manager

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0,12 * * *'

concurrency: download-${{ github.ref }}

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast blobless checkout
        run: |
          git clone --depth=1 --filter=blob:none --single-branch --no-checkout \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git sparse-checkout init --cone
          git sparse-checkout set scripts/ .github/workflows/ repo.txt state.json INDEX.md
          git checkout
          git sparse-checkout add downloads/ repos/
          mkdir -p downloads repos

      - name: Save original commit message (push events only)
        if: github.event_name == 'push'
        run: |
          ORIG_MSG=$(git log -1 --pretty=%B)
          echo "ORIGINAL_COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          echo "$ORIG_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 p7zip-full
          pip install --quiet requests psutil tqdm

      - name: Update repos from repo.txt
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: python3 scripts/download_manager.py update --no-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process commit URL
        if: github.event_name == 'push'
        run: python3 scripts/download_manager.py commit --msg "$ORIGINAL_COMMIT_MESSAGE" --no-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push all downloads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state.json downloads/ repos/ INDEX.md
          if git diff-index --quiet --cached HEAD --; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Sync downloads [skip ci]"
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push origin main; then
              echo "Push successful"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES"
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              git pull --rebase origin main
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
